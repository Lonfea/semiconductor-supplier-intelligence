[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "semiconductor-supplier-intelligence"
version = "1.0.0"
description = "Auditable semiconductor foundry market intelligence and supplier-risk platform"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "pydantic>=2.8", "uvicorn>=0.30", "streamlit>=1.37"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

